<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle — Worldview Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f6;--ink:#13212b;--mu:#5d6b75;--cd:#fff;--ln:#d5dde1;--ac:#0e5a63;--go:#b97a12;--ok:#1f6b45;--wn:#8f5a0d;--bd:#9b3a3a;--tint:#e4edee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d161c;--ink:#e6edf0;--mu:#93a4ae;--cd:#15222a;--ln:#26373f;--ac:#5cc0c8;--go:#e3a540;--ok:#6fd09b;--wn:#e0a653;--bd:#e57f7f;--tint:#12262c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d161c;--ink:#e6edf0;--mu:#93a4ae;--cd:#15222a;--ln:#26373f;--ac:#5cc0c8;--go:#e3a540;--ok:#6fd09b;--wn:#e0a653;--bd:#e57f7f;--tint:#12262c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hanken Grotesk",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,.logo{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.3rem,6.5vw,4.2rem);letter-spacing:-.02em}h2{font-size:1.9rem;margin-top:1.6em}h3{font-size:1.25rem}p{margin:0 0 .9em}
a:focus-visible,button:focus-visible,.card:focus-visible,textarea:focus-visible{outline:2px solid var(--go);outline-offset:2px}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.logo{font-size:1.7rem;letter-spacing:.14em;cursor:pointer;margin:0}
.tg{color:var(--mu);font-size:.85rem;flex:1}
.th{background:none;border:1px solid var(--ln);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}
.layout{display:flex;max-width:1400px;margin:0 auto;align-items:flex-start}
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
nav{display:flex;flex-direction:column;gap:4px}
nav a{padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--mu);font-size:.9rem;transition:background .2s}
nav a:hover{background:var(--tint)}
nav a.on{background:var(--ac);color:var(--bg);font-weight:500}
main{flex:1;padding:26px 40px 90px;min-width:0;overflow-x:hidden;max-width:100%;word-wrap:break-word}
@media(max-width:768px){.layout{flex-direction:column}.sidebar{width:100%;border-right:none;border-bottom:1px solid var(--ln);padding:10px 14px;height:auto;position:static;overflow-y:visible}nav{flex-direction:row;overflow-x:auto;padding-bottom:8px}nav a{white-space:nowrap}main{padding:20px}}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:18px;margin-bottom:10px;display:block;width:100%;text-align:left;color:inherit;font:inherit;}
.big{background:var(--ac);color:var(--bg);border:0;padding:26px}.big h3{letter-spacing:.08em}.big.alt{background:var(--go)}.big p{margin:0}
.chip{display:inline-block;border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:99px;padding:4px 13px;margin:0 6px 8px 0;cursor:pointer;font:inherit;font-size:.88rem}.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:9px 18px;font:600 .95rem inherit;cursor:pointer}.btn.g{background:none;color:var(--ac);border:1px solid var(--ac)}
.sub{color:var(--mu);font-size:.86rem;margin:0 0 .5em}.note{background:var(--tint);border-left:3px solid var(--go);padding:10px 14px;font-size:.88rem;margin:0 0 20px;border-radius:2px}
.box{border-top:2px solid var(--ac);padding-top:8px;margin:14px 0}.box.s{border-color:var(--go)}
textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--ink);min-height:70px;margin-bottom:10px}
.q{background:var(--tint);padding:10px 14px;border-radius:12px 12px 2px 12px;margin:20px 0 8px;font-weight:500}
details{border:1px solid var(--ln);border-radius:8px;padding:10px 14px;margin-bottom:10px;background:var(--cd);cursor:pointer}
summary{font-weight:600;color:var(--ac)}
.verse-item{padding:8px 0;border-bottom:1px solid var(--tint);font-size:0.95rem;margin:0}
.verse-item:last-child{border-bottom:none}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:15px}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:0.9rem;cursor:pointer}
.action-bar{display:flex;gap:10px;margin-bottom:15px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h2 class="logo" onclick="location.hash='home'">Oracle</h2>
    <span class="tg">Unity without Uniformity</span>
    <button class="th" aria-label="Toggle theme" onclick="tg()">◐</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <nav id="nv" aria-label="Main"></nav>
  </aside>
  <main id="m"></main>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const tg=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes("dark");r.dataset.theme=d?"light":"dark"};
const PG=[["home","Home"],["ask","Ask Humanity"],["questions","Question Explorer"],["perspectives","Explore Perspectives"],["map","Connections"],["religions","Religions & Traditions"],["philosophy","Philosophy & Ideas"],["voices","Voices of Wisdom"],["culture","Culture & Human Knowledge"],["together","Living Together"],["journeys","Guided Journeys"],["dialogue","Dialogue Without Agreement"],["plans","Plans"],["about","About Oracle"]];
const FAITHS=["Islam", "Christianity", "Judaism", "Buddhism", "Hindu traditions", "Stoicism", "Taoism", "Sikhism", "Confucianism", "Contemporary Teachers", "Swaminarayan", "Latter-day Saints", "Jainism", "Bahá'í", "Indigenous Wisdom"];
const CATS=["Understanding Religions","God and Existence","Life and Purpose","Consciousness and Spirituality","Morality and Human Behaviour","Death and the Afterlife","Culture and Humanity","Great Thinkers and Teachers"];

let thread = []; // Keeps track of questions and answers

const V={
home(){return`<section class="hero"><div><h1>The World’s Knowledge. Humanity’s Perspectives.</h1><p class="lead">Explore the ideas, beliefs, traditions and wisdom that have shaped humanity. Discover what connects us, understand what distinguishes us, and learn to see the world through different perspectives.</p></div>
<svg viewBox="0 0 300 300" role="img" aria-label="Seven distinct overlapping circles around a shared centre"><g style="mix-blend-mode:multiply" opacity=".8">${["#0e8a93","#d99a1e","#c2507a","#4f5fc4","#4a9a5b","#c46a2c","#7a54b0"].map((c,i)=>{const a=i/7*6.283;return`<circle cx="${150+Math.cos(a)*52}" cy="${150+Math.sin(a)*52}" r="70" fill="${c}" opacity=".55"/>`}).join("")}</g><circle cx="150" cy="150" r="9" fill="var(--ink)"/></svg></section>
<div class="two"><button class="card big" onclick="location.hash='ask'"><h3>ASK HUMANITY</h3><p>An open conversational experience where you can ask questions about any aspect of human knowledge, beliefs, philosophy, spirituality or existence.</p></button><button class="card big alt" onclick="location.hash='questions'"><h3>EXPLORE QUESTIONS</h3><p>An interactive discovery experience that helps you find questions, ideas and subjects you may never have considered.</p></button></div>`},
ask(){
  return`<h1 style="font-size:2.4rem">Ask Humanity</h1><p class="lead">Select the traditions you want to compare, and ask a question.</p>
  <div class="note"><b>Select Traditions to Compare:</b></div>
  <div class="action-bar">
    <button class="btn g" onclick="toggleAll(true)">✓ Select All</button>
    <button class="btn g" onclick="toggleAll(false)">✗ Deselect All</button>
  </div>
  <div class="checkbox-grid" id="checkbox-container">${FAITHS.map(f=>`<label class="checkbox-label"><input type="checkbox" class="faith-check" value="${f}" checked> ${f}</label>`).join("")}</div>
  
  <div style="margin-top:20px; margin-bottom: 20px;">
    ${thread.map(t=>`<div class="q">${esc(t.q)}</div>${t.h}`).join("")}
  </div>

  <div class="card">
    <textarea id="qi" placeholder="For example: What does it say about the nature of suffering?"></textarea>
    <button class="btn" onclick="doAsk()">Ask AI</button>
  </div>`
},
questions(){return`<h1 style="font-size:2.4rem">Question Explorer</h1><p class="lead">Choose a category or a question to open a structured exploration.</p><div class="card"><p>Coming Soon.</p></div>`},
perspectives(){return`<h1>Explore Perspectives</h1><div class="card"><p>Coming Soon.</p></div>`},
map(){return`<h1>Connections</h1><div class="card"><p>Coming Soon.</p></div>`},
religions(){return`<h1>Religions & Traditions</h1><div class="card"><p>Coming Soon.</p></div>`},
philosophy(){return`<h1>Philosophy & Ideas</h1><div class="card"><p>Coming Soon.</p></div>`},
voices(){return`<h1>Voices of Wisdom</h1><div class="card"><p>Coming Soon.</p></div>`},
culture(){return`<h1>Culture & Human Knowledge</h1><div class="card"><p>Coming Soon.</p></div>`},
together(){return`<h1>Living Together</h1><div class="card"><p>Coming Soon.</p></div>`},
journeys(){return`<h1>Guided Journeys</h1><div class="card"><p>Coming Soon.</p></div>`},
dialogue(){return`<h1>Dialogue Without Agreement</h1><div class="card"><p>Coming Soon.</p></div>`},
plans(){return`<h1>Plans</h1><div class="card"><p>Coming Soon.</p></div>`},
about(){return`<h1>About Oracle</h1><p>The objective is to help humanity become better at being different together.</p>`}
};

function toggleAll(state) {
    document.querySelectorAll('.faith-check').forEach(cb => cb.checked = state);
}

async function doAsk(){
    const q=$("#qi").value.trim(); if(!q) return;
    
    const selected = Array.from(document.querySelectorAll('.faith-check:checked')).map(cb => cb.value);
    if(selected.length === 0) { alert("Please select at least one tradition."); return; }

    // Save the question and a loading message to our thread
    thread.push({q, h:'<p class="sub">Searching the Oracle AI database...</p>'});
    render(); // Re-render to show the loading message immediately and clear the textarea

    try{
        const res=await fetch("/api/ask",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({question:q, faiths:selected})
        });
        if(!res.ok) throw new Error("Backend offline");
        const data=await res.json();
        
        let html=`<div class="box s"><h3>Universal thread</h3><p>${data.universal_thread||"No shared thread found."}</p></div>`;
        
        if(data.aligned_verses&&data.aligned_verses.length>0){
            html+=`<details><summary>📖 View Aligned Verses (${data.aligned_verses.length})</summary>`;
            data.aligned_verses.forEach(v=>{
                let url = `https://www.google.com/search?q=${encodeURIComponent(v.faith + ' ' + v.citation)}`;
                const c = v.citation.toLowerCase();
                if (c.includes('quran')) { const m = v.citation.match(/(\d+):(\d+)/); if(m) url = `https://quran.com/${m[1]}/${m[2]}`; }
                else if (c.includes('genesis') || c.includes('john') || c.includes('matthew')) { url = `https://www.biblegateway.com/passage/?search=${encodeURIComponent(v.citation)}`; }
                else if (c.includes('gita')) { const m = v.citation.match(/(\d+):(\d+)/); if(m) url = `https://www.holy-bhagavad-gita.org/chapter/${m[1]}/verse/${m[2]}`; }
                
                html += `<p class="verse-item"><b>${v.faith} (<a href="${url}" target="_blank" style="color:var(--ac);">${v.citation}</a>):</b> “${v.text}”</p>`;
            });
            html += `</details>`;
        }
        
        if(data.distinct_rationales&&data.distinct_rationales.length>0){
            html+=`<details><summary>🧠 View Distinct Rationales</summary>`;
            data.distinct_rationales.forEach(r=>{html+=`<p class="verse-item"><b>${r.faith}:</b> ${r.theological_logic}</p>`});
            html+=`</details>`;
        }
        
        if(data.insufficient_evidence){html+=`<p class="sub" style="color:var(--bd)"><b>Notice:</b> ${data.insufficient_evidence}</p>`}
        
        // Replace the loading message with the final answer
        thread[thread.length-1].h=html;
    }catch(err){
        thread[thread.length-1].h=`<p style="color:var(--bd)">Error: ${err.message}</p>`;
    }
    render(); // Re-render to show the final answer
}

function render(){const id=(location.hash||"#home").slice(1),p=V[id]?id:"home";$("#nv").innerHTML=PG.map(x=>`<a href="#${x[0]}" class="${x[0]===p?"on":""}">${x[1]}</a>`).join("");$("#m").innerHTML=V[p]()}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
