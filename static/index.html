<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle — Worldview Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f6;--ink:#13212b;--mu:#5d6b75;--cd:#fff;--ln:#d5dde1;--ac:#0e5a63;--go:#b97a12;--ok:#1f6b45;--wn:#8f5a0d;--bd:#9b3a3a;--tint:#e4edee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d161c;--ink:#e6edf0;--mu:#93a4ae;--cd:#15222a;--ln:#26373f;--ac:#5cc0c8;--go:#e3a540;--ok:#6fd09b;--wn:#e0a653;--bd:#e57f7f;--tint:#12262c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hanken Grotesk",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.logo{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(2.3rem,6.5vw,4.2rem);letter-spacing:-.02em}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.logo{font-size:1.7rem;letter-spacing:.14em;cursor:pointer;margin:0}
.layout{display:flex;max-width:1400px;margin:0 auto;align-items:flex-start}
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
nav{display:flex;flex-direction:column;gap:4px}
nav a{padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--mu);font-size:.9rem;transition:background .2s}
nav a:hover{background:var(--tint)}
nav a.on{background:var(--ac);color:var(--bg);font-weight:500}
main{flex:1;padding:26px 40px 90px;min-width:0;overflow-x:hidden;max-width:100%;word-wrap:break-word}
@media(max-width:768px){.layout{flex-direction:column}.sidebar{width:100%;border-right:none;border-bottom:1px solid var(--ln);padding:10px 14px;height:auto;position:static;overflow-y:visible}nav{flex-direction:row;overflow-x:auto;padding-bottom:8px}main{padding:20px}}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:18px;margin-bottom:10px;display:block;width:100%;text-align:left;color:inherit;font:inherit;}
.card:hover{border-color:var(--ac)}
.big{background:var(--ac);color:var(--bg);border:0;padding:26px}.big.alt{background:var(--go)}
.chip{display:inline-block;border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:99px;padding:4px 13px;margin:0 6px 8px 0;cursor:pointer;font:inherit;font-size:.88rem}.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:9px 18px;font:600 .95rem inherit;cursor:pointer}
.btn.g{background:none;color:var(--ac);border:1px solid var(--ac)}
.sub{color:var(--mu);font-size:.86rem;margin:0 0 .5em}.note{background:var(--tint);border-left:3px solid var(--go);padding:10px 14px;font-size:.88rem;margin:0 0 20px;border-radius:2px}
.box{border-top:2px solid var(--ac);padding-top:8px;margin:14px 0}.box.s{border-color:var(--go)}
textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--ink);min-height:70px;margin-bottom:10px}
.q{background:var(--tint);padding:10px 14px;border-radius:12px 12px 2px 12px;margin:20px 0 8px;font-weight:500}
details{border:1px solid var(--ln);border-radius:8px;padding:10px 14px;margin-bottom:10px;background:var(--cd);cursor:pointer}
summary{font-weight:600;color:var(--ac)}
.verse-item{padding:8px 0;border-bottom:1px solid var(--tint);font-size:0.95rem;margin:0}
.verse-item:last-child{border-bottom:none}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:15px}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:0.9rem;cursor:pointer}
.action-bar{display:flex;gap:10px;margin-bottom:15px}
select.dropdown{padding:12px;font-size:1rem;border-radius:8px;border:1px solid var(--ln);width:100%;max-width:400px;background:var(--cd);color:var(--ink);margin-bottom:20px;}
.quiz-option{display:block;padding:10px;border:1px solid var(--ln);border-radius:8px;margin-bottom:8px;cursor:pointer;}
.quiz-option:hover{background:var(--tint)}
.quiz-option input{margin-right:10px;}
.interfaith-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px;}
@media(max-width:600px){.interfaith-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h2 class="logo" onclick="location.hash='home'">Oracle</h2>
    <span class="tg">Unity without Uniformity</span>
    <button class="th" aria-label="Toggle theme" onclick="tg()">◐</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar"><nav id="nv" aria-label="Main"></nav></aside>
  <main id="m"></main>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const tg=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes("dark");r.dataset.theme=d?"light":"dark"};
const PG=[["home","Home"],["ask","Ask Humanity"],["learn","Learning Hub"],["interfaith","Interfaith & Blended"],["questions","Question Explorer"],["perspectives","Explore Perspectives"],["map","Connections"],["religions","Religions & Traditions"],["philosophy","Philosophy & Ideas"],["voices","Voices of Wisdom"],["culture","Culture & Human Knowledge"],["together","Living Together"],["journeys","Guided Journeys"],["dialogue","Dialogue Without Agreement"],["plans","Plans"],["about","About Oracle"]];

const RELIGIONS=["Islam", "Christianity", "Judaism", "Buddhism", "Hindu traditions", "Stoicism", "Taoism", "Sikhism", "Confucianism", "Contemporary Teachers", "Swaminarayan", "Latter-day Saints", "Jainism", "Bahá'í", "Indigenous Wisdom", "Atheism", "Agnosticism"];
const TOPICS=["Dietary Laws & Food", "Holidays & Festivals", "Raising Children", "Extended Family Dynamics", "Views on Salvation & Afterlife", "Gender Roles & Marriage"];

let thread = [];
let tutorialData = null;

const V={
home(){return`<section class="hero"><div><h1>The World’s Knowledge. Humanity’s Perspectives.</h1><p class="lead">Explore the ideas, beliefs, traditions and wisdom that have shaped humanity.</p></div></section>
<div class="two"><button class="card big" onclick="location.hash='ask'"><h3>ASK HUMANITY</h3><p>An open conversational experience.</p></button><button class="card big alt" onclick="location.hash='learn'"><h3>LEARNING HUB</h3><p>Deep dive, explore Q&As, and test your knowledge.</p></button></div>`},
ask(){
  return`<h1 style="font-size:2.4rem">Ask Humanity</h1><p class="lead">Select traditions and ask a question.</p>
  <div class="action-bar"><button class="btn g" onclick="toggleAll(true)">✓ Select All</button><button class="btn g" onclick="toggleAll(false)">✗ Deselect All</button></div>
  <div class="checkbox-grid" id="checkbox-container">${RELIGIONS.map(f=>`<label class="checkbox-label"><input type="checkbox" class="faith-check" value="${f}" checked> ${f}</label>`).join("")}</div>
  <div style="margin-top:20px; margin-bottom: 20px;">${thread.map(t=>`<div class="q">${esc(t.q)}</div>${t.h}`).join("")}</div>
  <div class="card"><textarea id="qi" placeholder="For example: What does it say about the nature of suffering?"></textarea><button class="btn" onclick="doAsk()">Ask AI</button></div>`
},
learn(){
  return`<h1 style="font-size:2.4rem">Learning Hub</h1><p class="lead">Select a tradition to generate a full tutorial, FAQs, and a 10-question quiz.</p>
  <select class="dropdown" onchange="loadTutorial(this.value)">
    <option value="">-- Select a tradition --</option>
    ${RELIGIONS.map(f=>`<option value="${f}">${f}</option>`).join("")}
  </select>
  <div id="tutorial-out"></div>`
},
interfaith(){
  return`<h1 style="font-size:2.4rem">Interfaith & Blended</h1><p class="lead">Navigate the beautiful complexity of two traditions meeting. Find common ground and understand the "why" behind the friction.</p>
  
  <div class="card" style="cursor:default;">
    <div class="interfaith-grid">
        <div>
            <label class="sub">Tradition A</label>
            <select class="dropdown" id="faith-a" style="max-width:100%;">${RELIGIONS.map(f=>`<option value="${f}">${f}</option>`).join("")}</select>
        </div>
        <div>
            <label class="sub">Tradition B</label>
            <select class="dropdown" id="faith-b" style="max-width:100%;">${RELIGIONS.map(f=>`<option value="${f}">${f}</option>`).join("")}</select>
        </div>
    </div>
    <label class="sub">What friction point are you navigating?</label>
    <select class="dropdown" id="topic" style="max-width:100%;">${TOPICS.map(t=>`<option value="${t}">${t}</option>`).join("")}</select>
    <button class="btn" onclick="askInterfaith()">Generate Guidance</button>
  </div>
  
  <div id="interfaith-out" style="margin-top:20px;"></div>`
},
questions(){return`<h1>Question Explorer</h1><div class="card"><p>Coming Soon.</p></div>`},
perspectives(){return`<h1>Explore Perspectives</h1><div class="card"><p>Coming Soon.</p></div>`},
map(){return`<h1>Connections</h1><div class="card"><p>Coming Soon.</p></div>`},
religions(){return`<h1>Religions & Traditions</h1><div class="card"><p>Coming Soon.</p></div>`},
philosophy(){return`<h1>Philosophy & Ideas</h1><div class="card"><p>Coming Soon.</p></div>`},
voices(){return`<h1>Voices of Wisdom</h1><div class="card"><p>Coming Soon.</p></div>`},
culture(){return`<h1>Culture & Human Knowledge</h1><div class="card"><p>Coming Soon.</p></div>`},
together(){return`<h1>Living Together</h1><div class="card"><p>Coming Soon.</p></div>`},
journeys(){return`<h1>Guided Journeys</h1><div class="card"><p>Coming Soon.</p></div>`},
dialogue(){return`<h1>Dialogue Without Agreement</h1><div class="card"><p>Coming Soon.</p></div>`},
plans(){return`<h1>Plans</h1><div class="card"><p>Coming Soon.</p></div>`},
about(){return`<h1>About Oracle</h1><p>The objective is to help humanity become better at being different together.</p>`}
};

function toggleAll(state) {
    document.querySelectorAll('.faith-check').forEach(cb => cb.checked = state);
}

async function doAsk(){
    const q=$("#qi").value.trim(); if(!q) return;
    const selected = Array.from(document.querySelectorAll('.faith-check:checked')).map(cb => cb.value);
    if(selected.length === 0) { alert("Please select at least one tradition."); return; }

    thread.push({q, h:'<p class="sub">Searching the Oracle AI database...</p>'}); render(); 

    try{
        const res=await fetch("/api/ask",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({question:q, faiths:selected}) });
        if(!res.ok) throw new Error("Backend offline");
        const data=await res.json();
        
        let html=`<div class="box s"><h3>Universal thread</h3><p>${data.universal_thread||"No shared thread found."}</p></div>`;
        if(data.aligned_verses&&data.aligned_verses.length>0){
            html+=`<details><summary>📖 View Aligned Verses (${data.aligned_verses.length})</summary>`;
            data.aligned_verses.forEach(v=>{ html += `<p class="verse-item"><b>${v.faith} (${v.citation}):</b> “${v.text}”</p>`; });
            html += `</details>`;
        }
        if(data.distinct_rationales&&data.distinct_rationales.length>0){
            html+=`<details><summary>🧠 View Distinct Rationales</summary>`;
            data.distinct_rationales.forEach(r=>{ html += `<p class="verse-item"><b>${r.faith}:</b> ${r.theological_logic}</p>`; });
            html+=`</details>`;
        }
        thread[thread.length-1].h=html;
    }catch(err){
        thread[thread.length-1].h=`<p style="color:var(--bd)">Error: ${err.message}</p>`;
    }
    render();
}

async function askInterfaith() {
    const faith_a = $("#faith-a").value;
    const faith_b = $("#faith-b").value;
    const topic = $("#topic").value;
    
    if (faith_a === faith_b) {
        alert("Please select two different traditions to compare.");
        return;
    }
    
    const out = $("#interfaith-out");
    out.innerHTML = `<p class="sub">Bridging ${faith_a} and ${faith_b} regarding "${topic}"...</p>`;
    
    try {
        const res = await fetch("/api/interfaith", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ faith_a: faith_a, faith_b: faith_b, topic: topic })
        });
        const data = await res.json();
        
        let html = `<div class="card" style="cursor:default;"><h2>Bridging: ${data.topic}</h2>`;
        
        html += `<div class="box"><h3>${faith_a} Perspective</h3><p>${data.faith_a_perspective}</p></div>`;
        html += `<div class="box"><h3>${faith_b} Perspective</h3><p>${data.faith_b_perspective}</p></div>`;
        html += `<div class="box s"><h3>Shared Common Ground</h3><p>${data.common_ground}</p></div>`;
        
        html += `<div class="box"><h3>Practical Advice</h3><p>${data.practical_advice.replace(/\n/g, '<br>')}</p></div>`;
        
        if(data.verses && data.verses.length > 0){
            html+=`<details><summary>📖 View Primary Texts Used</summary>`;
            data.verses.forEach(v=>{ html += `<p class="verse-item"><b>${v.faith} (${v.citation}):</b> “${v.text}”</p>`; });
            html += `</details>`;
        }
        
        html += `</div>`;
        out.innerHTML = html;
        
    } catch (e) {
        out.innerHTML = `<p style="color:var(--bd)">Error: ${e.message}</p>`;
    }
}

async function loadTutorial(faith) {
    if (!faith) return;
    const out = $("#tutorial-out");
    out.innerHTML = `<p class="sub">Generating comprehensive tutorial for ${faith}... (This may take 10-15 seconds)</p>`;
    
    try {
        const res = await fetch("/api/tutorial", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ faith: faith })
        });
        const data = await res.json();
        tutorialData = data;
        
        let html = `<h2>Learning ${data.tradition}</h2><p class="lead">${data.description}</p>`;
        
        html += `<h3>📚 Modules</h3>`;
        data.modules.forEach((mod, i) => {
            html += `<details><summary>Module ${i+1}: ${mod.title}</summary><p>${mod.content}</p></details>`;
        });
        
        html += `<h3>❓ Frequently Asked Questions</h3>`;
        data.faqs.forEach(faq => {
            html += `<details><summary>${faq.question}</summary><p>${faq.answer}</p></details>`;
        });
        
        html += `<h3>📝 Proficiency Quiz (10 Questions)</h3>`;
        html += `<form id="quiz-form" onsubmit="submitQuiz(event)">`;
        data.quiz.forEach((q, i) => {
            html += `<div class="card" style="cursor:default;"><p><b>Q${i+1}: ${q.question}</b></p>`;
            q.options.forEach((opt, j) => {
                html += `<label class="quiz-option"><input type="radio" name="q${i}" value="${j}" required> ${opt}</label>`;
            });
            html += `</div>`;
        });
        html += `<button type="submit" class="btn" style="margin-top:20px;">Submit Quiz</button>`;
        html += `</form>`;
        html += `<div id="quiz-result" style="margin-top:20px;"></div>`;
        
        out.innerHTML = html;
    } catch (e) {
        out.innerHTML = `<p style="color:var(--bd)">Error generating tutorial: ${e.message}</p>`;
    }
}

function submitQuiz(e) {
    e.preventDefault();
    let score = 0;
    tutorialData.quiz.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && parseInt(selected.value) === q.answer_index) {
            score++;
        }
    });
    
    let level = "Beginner";
    if (score >= 8) level = "Advanced Scholar";
    else if (score >= 5) level = "Intermediate Student";
    
    const resultDiv = $("#quiz-result");
    resultDiv.innerHTML = `
        <div class="box s" style="text-align:center;">
            <h2>Quiz Complete!</h2>
            <p style="font-size:2rem; font-weight:bold;">${score} / 10</p>
            <p>You have achieved: <b>${level}</b> proficiency in ${tutorialData.tradition}.</p>
            <button class="btn" onclick="loadTutorial('${tutorialData.tradition}')">Try Again</button>
        </div>
    `;
    window.scrollTo(0, document.body.scrollHeight);
}

function render(){const id=(location.hash||"#home").slice(1),p=V[id]?id:"home";$("#nv").innerHTML=PG.map(x=>`<a href="#${x[0]}" class="${x[0]===p?"on":""}">${x[1]}</a>`).join("");$("#m").innerHTML=V[p]()}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
