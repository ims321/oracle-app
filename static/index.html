<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle — Worldview Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f6;--ink:#13212b;--mu:#5d6b75;--cd:#fff;--ln:#d5dde1;--ac:#0e5a63;--go:#b97a12;--ok:#1f6b45;--wn:#8f5a0d;--bd:#9b3a3a;--tint:#e4edee;color-scheme:light;box-sizing:border-box;}
@media(prefers-color-scheme:dark){:root{--bg:#0d161c;--ink:#e6edf0;--mu:#93a4ae;--cd:#15222a;--ln:#26373f;--ac:#5cc0c8;--go:#e3a540;--ok:#6fd09b;--wn:#e0a653;--bd:#e57f7f;--tint:#12262c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hanken Grotesk",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.logo{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 .5em}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.logo{font-size:1.7rem;letter-spacing:.14em;cursor:pointer;margin:0}
.layout{display:flex;max-width:1400px;margin:0 auto;align-items:flex-start}
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
nav{display:flex;flex-direction:column;gap:4px}
nav a{padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--mu);font-size:.9rem;transition:background .2s}
nav a:hover{background:var(--tint)}
nav a.on{background:var(--ac);color:var(--bg);font-weight:500}
main{flex:1;padding:26px 40px 90px;min-width:0;overflow-x:hidden;max-width:100%;word-wrap:break-word}
@media(max-width:768px){.layout{flex-direction:column}.sidebar{width:100%;border-right:none;border-bottom:1px solid var(--ln);padding:10px 14px;height:auto;position:static;overflow-y:visible}nav{flex-direction:row;overflow-x:auto;padding-bottom:8px}nav a{white-space:nowrap}main{padding:20px}}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:18px;margin-bottom:10px;display:block;width:100%;text-align:left;color:inherit;font:inherit;}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:9px 18px;font:600 .95rem inherit;cursor:pointer}
textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--ink);min-height:70px;margin-bottom:10px}
.note{background:var(--tint);border-left:3px solid var(--go);padding:10px 14px;font-size:.88rem;margin:0 0 20px;border-radius:2px}
.box{border-top:2px solid var(--ac);padding-top:8px;margin:14px 0}.box.s{border-color:var(--go)}
details{border:1px solid var(--ln);border-radius:8px;padding:10px 14px;margin-bottom:10px;background:var(--cd);cursor:pointer}
summary{font-weight:600;color:var(--ac)}
.verse-item{padding:8px 0;border-bottom:1px solid var(--tint);font-size:0.95rem;margin:0}
.verse-item:last-child{border-bottom:none;}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:15px}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:0.9rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="top">
    <h2 class="logo" onclick="location.hash='home'">Oracle</h2>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <nav id="nv" aria-label="Main"></nav>
  </aside>
  <main id="m"></main>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PG=[["home","Home"],["ask","Ask Humanity"],["learn","Learning Hub"],["about","About Oracle"]];
const FAITHS=["Islam", "Christianity", "Judaism", "Buddhism", "Hindu traditions", "Stoicism", "Taoism", "Sikhism", "Confucianism", "Contemporary Teachers", "Swaminarayan", "Latter-day Saints", "Jainism", "Bahá'í", "Indigenous Wisdom"];

const V={
home(){return`<h1>The World’s Knowledge. Humanity’s Perspectives.</h1><p class="lead">Explore the ideas, beliefs, traditions and wisdom that have shaped humanity.</p><div class="card" onclick="location.hash='ask'"><h3>ASK HUMANITY</h3><p>Compare multiple traditions in one AI-generated response.</p></div><div class="card" onclick="location.hash='learn'"><h3>LEARNING HUB</h3><p>Take a deep dive into a specific tradition.</p></div>`},
ask(){
  return`<h1>Ask Humanity</h1><p class="lead">Select the traditions you want to compare, and ask a question.</p>
  <div class="note"><b>Select Traditions to Compare:</b></div>
  <div class="checkbox-grid">${FAITHS.map(f=>`<label class="checkbox-label"><input type="checkbox" class="faith-check" value="${f}" checked> ${f}</label>`).join("")}</div>
  <div class="card">
    <textarea id="qi" placeholder="For example: What does it say about the nature of suffering?"></textarea>
    <button class="btn" onclick="doAsk()">Ask AI</button>
    <div id="out" style="margin-top:20px;"></div>
  </div>`
},
learn(){return`<h1>Learning Hub</h1><p class="lead">Step-by-step guides and quizzes to deeply understand each tradition.</p><div class="card"><h3>Coming Soon</h3><p>We are building deep-dive tutorials and dynamic quizzes for each discipline. Check back soon!</p></div>`},
about(){return`<h1>About Oracle</h1><p>The objective is to help humanity become better at being different together.</p>`}
};

async function doAsk(){
    const q=$("#qi").value.trim(); if(!q) return;
    
    // Get selected faiths
    const selected = Array.from(document.querySelectorAll('.faith-check:checked')).map(cb => cb.value);
    if(selected.length === 0) { alert("Please select at least one tradition."); return; }

    const out=$("#out"); out.innerHTML="<p>Searching the Oracle AI database...</p>";
    
    try{
        const res=await fetch("/api/ask",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({question:q, faiths:selected})
        });
        if(!res.ok) throw new Error("Backend offline");
        const data=await res.json();
        
        let html=`<div class="box s"><h3>Universal thread</h3><p>${data.universal_thread||"No shared thread found."}</p></div>`;
        
        // Collapsible Aligned Verses
        if(data.aligned_verses && data.aligned_verses.length > 0){
            html += `<details><summary>📖 View Aligned Verses (${data.aligned_verses.length})</summary>`;
            data.aligned_verses.forEach(v=>{
                let url = `https://www.google.com/search?q=${encodeURIComponent(v.faith + ' ' + v.citation)}`;
                const c = v.citation.toLowerCase();
                if (c.includes('quran')) { const m = v.citation.match(/(\d+):(\d+)/); if(m) url = `https://quran.com/${m[1]}/${m[2]}`; }
                else if (c.includes('genesis') || c.includes('john') || c.includes('matthew')) { url = `https://www.biblegateway.com/passage/?search=${encodeURIComponent(v.citation)}`; }
                else if (c.includes('gita')) { const m = v.citation.match(/(\d+):(\d+)/); if(m) url = `https://www.holy-bhagavad-gita.org/chapter/${m[1]}/verse/${m[2]}`; }
                
                html += `<p class="verse-item"><b>${v.faith} (<a href="${url}" target="_blank" style="color:var(--ac);">${v.citation}</a>):</b> “${v.text}”</p>`;
            });
            html += `</details>`;
        }
        
        // Collapsible Distinct Rationales
        if(data.distinct_rationales && data.distinct_rationales.length > 0){
            html += `<details><summary>🧠 View Distinct Rationales</summary>`;
            data.distinct_rationales.forEach(r=>{
                html += `<p class="verse-item"><b>${r.faith}:</b> ${r.theological_logic}</p>`;
            });
            html += `</details>`;
        }
        
        out.innerHTML = html;
    }catch(err){
        out.innerHTML=`<p style="color:var(--bd)">Error: ${err.message}</p>`;
    }
}

function render(){const id=(location.hash||"#home").slice(1),p=V[id]?id:"home";$("#nv").innerHTML=PG.map(x=>`<a href="#${x[0]}" class="${x[0]===p?"on":""}">${x[1]}</a>`).join("");$("#m").innerHTML=V[p]()}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
