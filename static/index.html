async function doAsk(){
  const q=$("#qi").value.trim();if(!q)return false;
  const selected=Array.from(document.querySelectorAll('.faith-check:checked')).map(cb=>cb.value);
  if(selected.length===0){alert("Please select at least one tradition.");return;}
  thread.push({q,h:'<p class="sub">Searching the Oracle AI database...</p>'});render();
  try{
    const res=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,faiths:selected})});
    if(!res.ok)throw new Error("Backend offline");
    const data=await res.json();
    let html=`<div class="box s"><h3>Universal thread</h3><p>${data.universal_thread||"No shared thread found."}</p></div>`;
    if(data.aligned_verses&&data.aligned_verses.length>0){
      html+=`<details><summary>📖 View Aligned Verses (${data.aligned_verses.length})</summary>`;
      data.aligned_verses.forEach(v=>{html+=`<p class="verse-item"><b>${v.faith} (${v.citation}):</b> “${v.text}”</p>`});
      html+=`</details>`;
    }
    if(data.distinct_rationales&&data.distinct_rationales.length>0){
      html+=`<details><summary>🧠 View Distinct Rationales</summary>`;
      data.distinct_rationales.forEach(r=>{html+=`<p class="verse-item"><b>${r.faith}:</b> ${r.theological_logic}</p>`});
      html+=`</details>`;
    }
    thread[thread.length-1].h=html;
  }catch(err){thread[thread.length-1].h=`<p style="color:var(--bd)">Error: ${err.message}</p>`}
  render();
}

    if(data.verses&&data.verses.length>0){html+=`<details><summary>📖 View Primary Texts Used</summary>`;data.verses.forEach(v=>{html+=`<p class="verse-item"><b>${v.faith} (${v.citation}):</b> “${v.text}”</p>`});html+=`</details>`}

  }catch(e){out.innerHTML=`<p style="color:var(--bd)">Error: ${e.message}</p>`}
}

async function loadTutorial(faith){
  if(!faith)return;
  const out=$("#tutorial-out");out.innerHTML=`<p class="sub">Generating comprehensive tutorial for ${faith}...</p>`;
  try{
    const res=await fetch("/api/tutorial",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({faith})});
    const data=await res.json();tutorialData=data;
    let html=`<h2>Learning ${data.tradition}</h2><p class="lead">${data.description}</p><h3>📚 Modules</h3>`;
    data.modules.forEach((mod,i)=>{html+=`<details><summary>Module ${i+1}: ${mod.title}</summary><p>${mod.content}</p></details>`});
    html+=`<h3>❓ Frequently Asked Questions</h3>`;
    data.faqs.forEach(faq=>{html+=`<details><summary>${faq.question}</summary><p>${faq.answer}</p></details>`});
    html+=`<h3>📝 Proficiency Quiz (10 Questions)</h3><form id="quiz-form" onsubmit="submitQuiz(event)">`;
    data.quiz.forEach((q,i)=>{html+=`<div class="card" style="cursor:default;"><p><b>Q${i+1}: ${q.question}</b></p>`;q.options.forEach((opt,j)=>{html+=`<label class="quiz-option"><input type="radio" name="q${i}" value="${j}" required> ${opt}</label>`});html+=`</div>`});
    html+=`<button type="submit" class="btn" style="margin-top:20px;">Submit Quiz</button></form><div id="quiz-result" style="margin-top:20px;"></div>`;
    out.innerHTML=html;
  }catch(e){out.innerHTML=`<p style="color:var(--bd)">Error generating tutorial: ${e.message}</p>`}
}

function submitQuiz(e){
  e.preventDefault();let score=0;
  tutorialData.quiz.forEach((q,i)=>{const sel=document.querySelector(`input[name="q${i}"]:checked`);if(sel&&parseInt(sel.value)===q.answer_index)score++});
  let level="Beginner";if(score>=8)level="Advanced Scholar";else if(score>=5)level="Intermediate Student";
  $("#quiz-result").innerHTML=`<div class="box s" style="text-align:center;"><h2>Quiz Complete!</h2><p style="font-size:2rem;font-weight:bold;">${score} / 10</p><p>You have achieved: <b>${level}</b> proficiency in ${tutorialData.tradition}.</p><button class="btn" onclick="loadTutorial('${tutorialData.tradition}')">Try Again</button></div>`;
  window.scrollTo(0,document.body.scrollHeight);
}

  },
  "Europe": {
    com: [["Roma and Sinti peoples","Europe's largest minority, with a long history of persecution and rich cultural traditions."],["Muslim communities","A significant and growing population, particularly in Western Europe, with roots in North Africa, South Asia, and the Middle East."],["Eastern European migrants","Communities that have moved westward for work, bringing distinct languages and traditions."],["Regional identities","Groups like the Catalans, Scots, and Basques, who have strong regional identities and languages."],["Secular and post-Christian populations","Much of Western Europe is highly secular, though historically Christian."]],
    tk: [["Secularism (Laïcité)","In countries like France, religion is strictly separated from public life.","Religious symbols are banned in public schools.","Understand that secularism is a core value, not an attack on faith."],["Greetings","Handshakes are standard in business.","Friends may exchange kisses on the cheek (varies by country: 1, 2, or 3).","Wait for the other person to initiate a kiss."],["Language Pride","Europeans value their local languages.","Speaking English is common, but making an effort to say 'hello' or 'thank you' in the local language goes a long way.","Learn a few words."],["Personal Space","Personal space is generally smaller than in the US.","Expect less distance in conversation.","Do not back away too quickly; it can seem standoffish."],["Punctuality","Punctuality is highly valued, especially in Northern Europe.","Being late is considered disrespectful.","Arrive on time or slightly early."]],

V.together=()=>{
  const T=["Communities","Everyday toolkit","Myths and misunderstandings","Scenarios"];
  const c=["South Africa","United States","Europe","Elsewhere"];
  const data = LIVING_DATA[ctry];
  let b="";
  
  if(lt===0) b = `<div class="grid">${data.com.map(x=>`<div class="card" style="cursor:default"><h3>${x[0]}</h3><p style="margin:0">${x[1]}</p></div>`).join("")}</div>`;
  if(lt===1) b = `<div class="grid">${data.tk.map(x=>`<div class="card" style="cursor:default"><h3>${x[0]}</h3><p class="sub">You may notice: ${x[1]}</p><p>${x[2]}</p><p style="margin:0"><b>A respectful response:</b> ${x[3]}</p></div>`).join("")}</div>`;
  if(lt===2) b = `<div class="grid">${data.my.map(x=>`<div class="card" style="cursor:default"><p class="sub">Myth</p><h3>${x[0]}</h3><p>${x[1]}</p>${ev(x[2])}</div>`).join("")}</div>`;
  if(lt===3) b = (mode==="Teacher"?`<div class="box s"><h3>Ground rules</h3><p>Listen first. Speak for yourself. Challenge ideas, not people.</p></div>`:"") + data.sc.map((s,i)=>`<div class="box"><h3>${s[0]}</h3><p>${s[1]}</p>${s[2].map((o,k)=>`<button class="chip ${scn[i]===k?"on":""}" onclick="scn[${i}]=${k};render()">${o[0]}</button>`).join("")}${scn[i]!==undefined?`<p><b>What might happen:</b> ${s[2][scn[i]][1]}</p>`:""}${mode==="Teacher"?`<p class="sub"><b>Discussion:</b> ${s[3]}</p>`:""}</div>`).join("");

  return `<h1 style="font-size:2.4rem">Living Together</h1><p class="lead">Understanding the people around you. Differences met with curiosity rather than fear.</p>${flag}
  <p class="sub">Country</p>
  ${c.map(x=>`<button class="chip ${x===ctry?"on":""}" onclick="ctry='${x}';render()">${x}</button>`).join("")}
  <p class="sub" style="margin-top:6px">Explore</p>
  ${T.map((x,i)=>`<button class="chip ${i===lt?"on":""}" onclick="lt=${i};render()">${x}</button>`).join("")}
  <div style="margin-top:12px">${b}</div>`;
};

let mode="Everyone",ctry="South Africa",lt=0,scn={};
const mn=()=>mode==="Everyone"?"":`<div class="note">${mode==="Teacher"?"<b>Teacher mode:</b> ground rules and discussion questions are shown.":"<b>"+mode+":</b> questions are chosen for you in Ask Humanity."}</div>`;

V.religions=()=>lib("religions");V.philosophy=()=>lib("philosophy");V.voices=()=>lib("voices");V.culture=()=>lib("culture");
V.plans=()=>`<h1 style="font-size:2.4rem">Plans</h1><p class="lead">Free access to the knowledge and evidence layer, with paid tiers for convenience, depth and institutions.</p><div class="note">Illustrative pricing for the prototype. Nothing is for sale yet.</div>`;
function lib(pg){return`<h1 style="font-size:2.4rem">${LT[pg][0]}</h1><p class="lead">${LT[pg][1]}</p>${flag}<div class="grid">${D[pg].map((r,i)=>`<button class="card" onclick="openItem('${pg}',${i})"><p class="sub">${r[1]}</p><h3>${r[0]}</h3><p>${r[3].slice(0,110)}…</p>${ev(r[2])}</button>`).join("")}</div>`}

let cn=null;
const NN=["Ubuntu","Confucianism","Buddhism","Christianity","Islam","Hindu traditions","Judaism","Stoicism","Kantian ethics","Secular humanism","Existentialism","African traditions"];
const EG=[[0,1,"s","Both see a person as formed through relationships and duties to others. Scholars compare them as relational ethics."],[0,11,"s","Community and respect for ancestors run through many African traditions. Scholars debate how closely ubuntu reflects them."],[3,4,"s","Abrahamic monotheism, prophets and a final judgement."],[3,4,"d","The nature of Jesus and how salvation works."],[6,3,"s","Shared Hebrew scriptures and the idea of a covenant."],[6,3,"d","Whether Jesus is the Messiah."],[6,4,"s","Strict monotheism and a tradition of religious law."],[2,5,"s","Karma, rebirth and liberation from the cycle."],[2,5,"d","Whether a lasting self (atman) exists or not."],[2,7,"s","Freedom through training the mind and loosening attachment."],[1,7,"s","Moral cultivation and virtue as the path to a good life."],[8,9,"s","Human dignity grounded in reason and autonomy."],[9,10,"s","Meaning and responsibility rest with people."],[9,10,"d","Whether universal values exist or each person creates them."],[3,9,"d","Whether morality needs a divine source."],[4,5,"d","How one God relates to many deities or forms. Views within Hindu traditions vary."]];
V.map=()=>{const pt=i=>{const a=i*Math.PI/6-Math.PI/2;return[300+170*Math.cos(a),240+170*Math.sin(a)]},on=e=>cn===null||e[0]===cn||e[1]===cn,
ln=EG.map(e=>{const[a,b]=[pt(e[0]),pt(e[1])];const d=e[2]==="s"?`M${a}L${b}`:`M${a}Q${(a[0]+b[0])/2+(e[0]-e[1])*3},${(a[1]+b[1])/2+25} ${b}`;return`<path d="${d.replace(/(\d)(,)/g,"$1 ").replace(/,/g," ")}" fill="none" stroke="${e[2]==="s"?"var(--ok)":"var(--bd)"}" stroke-width="2" ${e[2]==="d"?'stroke-dasharray="5 4"':""} opacity="${on(e)?.8:.1}"/>`}).join(""),
nd=NN.map((n,i)=>{const[x,y]=pt(i),l=x>310?"start":x<290?"end":"middle",dx=l==="start"?12:l==="end"?-12:0,dy=y<100?-12:y>380?20:4;return`<g onclick="cn=${i};render()" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${cn===i?10:7}" fill="var(--ac)"/><text x="${x+dx}" y="${y+dy}" text-anchor="${l}" font-size="12" fill="var(--ink)" font-weight="${cn===i?600:400}">${n}</text></g>`}).join("");
return`<h1 style="font-size:2.4rem">Connections</h1><p class="lead">See where traditions share ideas and where they genuinely differ. Choose one to focus on its links.</p>${flag}<p><span class="ev ok">solid line: shared theme</span> <span class="ev bd">dashed line: genuine difference</span></p>${NN.map((n,i)=>`<button class="chip ${cn===i?"on":""}" onclick="cn=${i};render()">${n}</button>`).join("")}${cn!==null?`<button class="chip" onclick="cn=null;render()">Show all</button>`:""}<svg viewBox="-60 0 720 480" role="img" aria-label="Network of connections between traditions" style="width:100%;max-width:760px;display:block;margin:10px auto">${ln}${nd}</svg><div class="grid">${EG.filter(on).map(e=>`<div class="card" style="cursor:default"><p class="sub">${NN[e[0]]} and ${NN[e[1]]}</p><p style="margin:0 0 6px">${e[3]}</p><span class="ev ${e[2]==="s"?"ok":"bd"}">${e[2]==="s"?"Shared theme":"Genuine difference"}</span></div>`).join("")}</div>`};

function render(){
  try {
    const id=(location.hash||"#home").slice(1);
    const p=V[id]?id:"home";
    $("#nv").innerHTML=PG.map(x=>`<a href="#${x[0]}" class="${x[0]===p?"on":""}" onclick="qSel=null;jSel=null">${x[1]}</a>`).join("");
    $("#m").innerHTML=mn()+V[p]();
  } catch (err) {
    $("#m").innerHTML = `<div style="padding:20px; color:var(--bd); background:var(--cd); border-radius:8px;">
      <h2>Error Loading Page</h2>
      <p>The app hit a bug while trying to load this page.</p>
      <pre style="background:var(--tint); padding:10px; border-radius:4px; font-size:12px;">${err.message}</pre>
      <button class="btn" onclick="location.hash='home'; location.reload();">Reload App</button>
    </div>`;
  }
}
